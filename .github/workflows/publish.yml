on: 
  release: 
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
        
      - name: moon version 
        run: |
          moon version --all
          moon update

      - name: sync workspace versions
        run: |
          moon work sync
          git diff --exit-code
      - name: moon check
        run: |
          moon -C lib check --target all --deny-warn

      - name: moon test (lib)
        run: |
          moon -C lib test --target all --deny-warn

      - name: lint (lib)
        run: |
          moon -C lib fmt && git diff --exit-code
          moon -C lib info && git diff --exit-code

      - name: check and build (cli)
        run: |
          moon -C cli check --target native --deny-warn
          moon -C cli build --target native --release --deny-warn
          moon -C cli fmt && git diff --exit-code
          moon -C cli info --target native && git diff --exit-code

      - name: package (lib and cli)
        run: |
          moon -C lib package
          moon -C cli package

      - name: publish (lib and cli)
        run: |
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$SECRET" > "$HOME/.moon/credentials.json"
          moon -C lib publish
          moon update
          moon -C cli publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
